# Publishes main. Pull requests are validated by ci.yml (required checks), so a push to main does not repeat the
# full QA matrix. When a push to main changes the version in package.json, one release gate runs on the exact
# merged tree (the ruleset does not require branches to be up to date, so the squash result may differ from the
# PR head that CI validated), then a single VSIX is packaged, identified by SHA-256, and that same file is
# published to the Visual Studio Marketplace (Trusted Publishing, no stored token), Open VSX and the GitHub
# release. The Marketplace is the primary channel: the release depends on it, not on Open VSX, whose slower or
# held-back publishes are retried by the scheduled sync job in this same workflow. Publishing is idempotent: a
# version that already exists in a store is skipped.
# Run it by hand (Actions → publish → Run workflow) to publish the version currently on main.
# Setup and rotation: docs/RELEASE.md.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      open_vsx_sync:
        description: Synchronize the latest release to Open VSX only
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

# One publisher at a time for main; a running publish is never cancelled half-way.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.open_vsx_sync)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this run publishes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # Previous tip of main for this push (covers squash merges and pushes with several commits); HEAD^ otherwise.
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          base=HEAD^
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          previous=$(git show "$base:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo none)
          publish=false
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = push ] && [ "$version" != "$previous" ]; }; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (previous: $previous at $base). Publish: $publish." >> "$GITHUB_STEP_SUMMARY"

  package:
    # Release gate + packaging, only for commits that publish. Runs once on the exact merged tree; it is not a
    # repetition of the PR matrix on every push.
    name: Release gate and package
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release gate on the merged tree
        run: pnpm run verify:delivery
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Integration tests in a real VS Code
        run: xvfb-run -a pnpm run test:integration
      - run: pnpm exec vsce package --no-dependencies --out probato-pr.vsix
      - name: Check the packaged version and record the VSIX checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          packaged=$(unzip -p probato-pr.vsix extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error title=VSIX::Packaged version $packaged does not match planned version $VERSION."
            exit 1
          fi
          sha256sum probato-pr.vsix | tee probato-pr.vsix.sha256
          echo "VSIX $VERSION sha256 $(cut -d' ' -f1 probato-pr.vsix.sha256) from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: |
            probato-pr.vsix
            probato-pr.vsix.sha256
          if-no-files-found: error

  publish-marketplace:
    name: Publish to the Visual Studio Marketplace
    needs: [plan, package]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write # OIDC token exchanged with the Marketplace (Trusted Publishing policy for this workflow and environment)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Verify it is the packaged VSIX (SHA-256)
        run: sha256sum -c probato-pr.vsix.sha256
      - run: pnpm exec vsce publish --oidc --packagePath probato-pr.vsix --skip-duplicate
      - name: Wait until the version is live on the Marketplace
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          query='{"filters":[{"criteria":[{"filterType":7,"value":"armotusitio.probato-pr"}]}],"flags":1}'
          for attempt in $(seq 1 60); do
            versions=$(curl -fsS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' -d "$query" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).results[0].extensions[0].versions.map(v=>v.version).join(' ')))" || true)
            case " $versions " in
              *" $VERSION "*) echo "Version $VERSION is live on the Marketplace."; exit 0 ;;
            esac
            echo "Waiting for $VERSION on the Marketplace (attempt $attempt of 60)..."
            sleep 15
          done
          echo "::error title=Marketplace::Version $VERSION did not become visible within 15 minutes."
          exit 1

  publish-open-vsx:
    name: Publish to Open VSX (does not block the release)
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Verify it is the packaged VSIX (SHA-256)
        run: sha256sum -c probato-pr.vsix.sha256
      - name: Publish with retries and wait for it to become active
        run: node scripts/open-vsx-publish.mjs probato-pr.vsix --trusted-publishing

  release:
    name: GitHub release
    needs: [plan, publish-marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Verify it is the packaged VSIX (SHA-256)
        run: sha256sum -c probato-pr.vsix.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md || echo "Probato PR $VERSION" > notes.md
          gh release create "$tag" probato-pr.vsix probato-pr.vsix.sha256 --target "$GITHUB_SHA" --title "Probato PR $VERSION" --notes-file notes.md

  sync-open-vsx:
    name: Synchronize the latest release to Open VSX
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.open_vsx_sync))
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Latest release
        id: release
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "published=$(gh release view "$tag" --json publishedAt --jq .publishedAt)" >> "$GITHUB_OUTPUT"
      - name: Is it active on Open VSX?
        id: before
        run: echo "active=$(node scripts/open-vsx-publish.mjs --check '${{ steps.release.outputs.version }}')" >> "$GITHUB_OUTPUT"
      - name: Publish the release asset again
        if: steps.before.outputs.active != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "$TAG" --pattern probato-pr.vsix --dir "$RUNNER_TEMP"
          node scripts/open-vsx-publish.mjs "$RUNNER_TEMP/probato-pr.vsix" --version "$VERSION" --trusted-publishing
      - name: Is it active now?
        id: after
        run: echo "active=$(node scripts/open-vsx-publish.mjs --check '${{ steps.release.outputs.version }}')" >> "$GITHUB_OUTPUT"
      - name: Open or close the tracking issue
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          ACTIVE: ${{ steps.after.outputs.active }}
        run: |
          title="Open VSX is out of sync with the latest release"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$ACTIVE" = true ]; then
            echo "Version $VERSION is active on Open VSX."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Version $VERSION is now active on Open VSX."
            fi
            exit 0
          fi
          age_days=$(( ( $(date +%s) - $(date -d "$PUBLISHED" +%s) ) / 86400 ))
          echo "::warning title=Open VSX::Version $VERSION is still not active ($age_days day(s) after the release)."
          if [ "$age_days" -ge 3 ] && [ -z "$existing" ]; then
            gh issue create --title "$title" --body "Version $VERSION was released $age_days days ago and is still not active on Open VSX. The daily sync keeps retrying. Check the status at https://open-vsx.org/user-settings/extensions and the namespace claim (https://github.com/EclipseFdn/open-vsx.org/issues/15149)."
          fi
